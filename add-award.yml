name: Add an award
description: Adds one line to Honors & Awards on the website.
title: "Add award"
labels: ["award"]
body:
  - type: input
    id: year
    attributes:
      label: Year
      placeholder: "2027"
    validations:
      required: true
  - type: input
    id: award
    attributes:
      label: Award
      placeholder: Award name and who gave it
    validations:
      required: true
