name: Add a paper
description: Adds one paper to the README and the website.
title: "Add paper"
labels: ["publication"]
body:
  - type: input
    id: paper_title
    attributes:
      label: Paper title
      placeholder: Exact title as published
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Year
      placeholder: "2027"
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue
      description: Conference or journal, short form.
      placeholder: Conference or journal short name + year
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Paper link
      placeholder: https://arxiv.org/abs/xxxx.xxxxx
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Authors
      description: Optional. Your name is bolded automatically.
      placeholder: Subrata Pramanik, Mohammed Javed, David Doermann
  - type: input
    id: code
    attributes:
      label: Code link
      description: Optional.
      placeholder: https://github.com/Subrata-CS/repo-name
  - type: input
    id: image
    attributes:
      label: Teaser image link
      description: Optional. A figure from the paper, shown beside it on the website.
      placeholder: https://raw.githubusercontent.com/Subrata-CS/Subrata-CS/main/assets/papers/fig.png
  - type: input
    id: note
    attributes:
      label: Note
      description: Optional, e.g. Oral, Spotlight, Best Paper.
