<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" width="1200" height="236" role="img"
     aria-label="Every topic opens the same five ways: description, notes, tutorials, run your code, and projects">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D0929"/><stop offset="55%" stop-color="#171040"/><stop offset="100%" stop-color="#0F0A30"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.4" fill="#fff" opacity=".07"/></pattern>
  <radialGradient id="hz"><stop offset="0" stop-color="#6D5AF7" stop-opacity=".5"/><stop offset="1" stop-color="#6D5AF7" stop-opacity="0"/></radialGradient>
  <radialGradient id="hz2"><stop offset="0" stop-color="#22C9E8" stop-opacity=".34"/><stop offset="1" stop-color="#22C9E8" stop-opacity="0"/></radialGradient>
  <clipPath id="round"><rect width="1200" height="236" rx="18"/></clipPath>
  <style>
    .f{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'DejaVu Sans Mono',Consolas,monospace}
    .ttl{font-size:15.5px;font-weight:700;fill:#FFFFFF;letter-spacing:-.2px}
    .dsc{font-size:11.8px;fill:#A9A2D6}
    .idx{font-size:9.5px;letter-spacing:1.6px}
    @keyframes rise{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,-14px)}}
    @keyframes bar{0%{transform:scaleX(.2)}100%{transform:scaleX(1)}}
    .card{animation:rise .7s cubic-bezier(.2,.7,.25,1) both}
    .top{transform-box:fill-box;transform-origin:left;animation:bar 1s cubic-bezier(.2,.7,.25,1) both}
    #h1{animation:drift 17s ease-in-out infinite}
    #h2{animation:drift 22s ease-in-out infinite reverse}
  </style>
</defs>

<g clip-path="url(#round)">
  <rect width="1200" height="236" fill="url(#bg)"/>
  <rect width="1200" height="236" fill="url(#dots)"/>
  <circle id="h1" cx="120" cy="0" r="210" fill="url(#hz)"/>
  <circle id="h2" cx="1090" cy="236" r="220" fill="url(#hz2)"/>

  <text class="m" x="26" y="34" font-size="11" letter-spacing="3" fill="#8F88C4">EVERY TOPIC OPENS THE SAME FIVE WAYS</text>
  <rect x="26" y="44" width="150" height="2.5" rx="1.5" fill="#6D5AF7"/>

  <!-- 01 · Description -->
  <g class="card" style="animation-delay:.05s">
    <rect x="26" y="66" width="216" height="148" rx="14" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.12)"/>
    <rect class="top" x="26" y="66" width="216" height="3" rx="1.5" fill="#6D5AF7" style="animation-delay:.25s"/>
    <rect x="44" y="86" width="34" height="34" rx="11" fill="rgba(109,90,247,.24)" stroke="rgba(109,90,247,.5)"/>
    <g stroke="#C4B8FF" stroke-width="1.7" fill="none" stroke-linecap="round">
      <path d="M53 96 h7 a4 4 0 0 1 4 4 v11 M69 96 h-7 a4 4 0 0 0 -4 4"/>
      <path d="M53 96 v14 h8 a4 4 0 0 1 4 4 a4 4 0 0 1 4 -4 h1 v-14"/>
    </g>
    <text class="m idx" x="222" y="98" text-anchor="end" fill="#6D5AF7">01</text>
    <text class="f ttl" x="44" y="146">Description</text>
    <text class="f dsc" x="44" y="170">The idea set out in full,</text>
    <text class="f dsc" x="44" y="188">in plain words.</text>
  </g>

  <!-- 02 · Notes -->
  <g class="card" style="animation-delay:.16s">
    <rect x="256" y="66" width="216" height="148" rx="14" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.12)"/>
    <rect class="top" x="256" y="66" width="216" height="3" rx="1.5" fill="#22C9E8" style="animation-delay:.36s"/>
    <rect x="274" y="86" width="34" height="34" rx="11" fill="rgba(34,201,232,.22)" stroke="rgba(34,201,232,.5)"/>
    <g stroke="#9BE7FF" stroke-width="1.7" stroke-linecap="round">
      <path d="M283 97 h13 M283 103 h16 M283 109 h9"/>
    </g>
    <text class="m idx" x="452" y="98" text-anchor="end" fill="#22C9E8">02</text>
    <text class="f ttl" x="274" y="146">Notes</text>
    <text class="f dsc" x="274" y="170">Compressed to what matters —</text>
    <text class="f dsc" x="274" y="188">the night-before version.</text>
  </g>

  <!-- 03 · Tutorials -->
  <g class="card" style="animation-delay:.27s">
    <rect x="486" y="66" width="216" height="148" rx="14" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.12)"/>
    <rect class="top" x="486" y="66" width="216" height="3" rx="1.5" fill="#22C58B" style="animation-delay:.47s"/>
    <rect x="504" y="86" width="34" height="34" rx="11" fill="rgba(34,197,139,.22)" stroke="rgba(34,197,139,.5)"/>
    <g stroke="#8DEBC4" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M512 101 l9 -5 l9 5 l-9 5 z"/><path d="M516 104 v5 c0 2 10 2 10 0 v-5"/>
    </g>
    <text class="m idx" x="682" y="98" text-anchor="end" fill="#22C58B">03</text>
    <text class="f ttl" x="504" y="146">Tutorials</text>
    <text class="f dsc" x="504" y="170">Walked through end to end,</text>
    <text class="f dsc" x="504" y="188">with nothing skipped.</text>
  </g>

  <!-- 04 · Run your code -->
  <g class="card" style="animation-delay:.38s">
    <rect x="716" y="66" width="216" height="148" rx="14" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.12)"/>
    <rect class="top" x="716" y="66" width="216" height="3" rx="1.5" fill="#F65C8E" style="animation-delay:.58s"/>
    <rect x="734" y="86" width="34" height="34" rx="11" fill="rgba(246,92,142,.2)" stroke="rgba(246,92,142,.5)"/>
    <path d="M747 96 l12 7 l-12 7 z" fill="#FFAFC8"/>
    <text class="m idx" x="912" y="98" text-anchor="end" fill="#F65C8E">04</text>
    <text class="f ttl" x="734" y="146">Run your code</text>
    <text class="f dsc" x="734" y="170">An environment that opens</text>
    <text class="f dsc" x="734" y="188">in one click.</text>
  </g>

  <!-- 05 · Projects -->
  <g class="card" style="animation-delay:.49s">
    <rect x="946" y="66" width="228" height="148" rx="14" fill="rgba(255,255,255,.055)" stroke="rgba(255,255,255,.12)"/>
    <rect class="top" x="946" y="66" width="228" height="3" rx="1.5" fill="#F7A93B" style="animation-delay:.69s"/>
    <rect x="964" y="86" width="34" height="34" rx="11" fill="rgba(247,169,59,.2)" stroke="rgba(247,169,59,.5)"/>
    <g stroke="#FFD69B" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M975 111 c-2 -9 3 -15 6 -17 c3 2 8 8 6 17 z"/><path d="M973 113 l3 -3 M990 113 l-3 -3"/>
    </g>
    <text class="m idx" x="1154" y="98" text-anchor="end" fill="#F7A93B">05</text>
    <text class="f ttl" x="964" y="146">Projects</text>
    <text class="f dsc" x="964" y="170">Real builds, from a first try</text>
    <text class="f dsc" x="964" y="188">to something ambitious.</text>
  </g>
</g>
</svg>
