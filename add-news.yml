name: Add news
description: Adds one line to the News list on the README and the website.
title: "Add news"
labels: ["news"]
body:
  - type: input
    id: month
    attributes:
      label: Month
      description: Optional. Format YYYY-MM. Leave empty for the current month.
      placeholder: "YYYY-MM"

  - type: textarea
    id: text
    attributes:
      label: News
      description: One sentence. Markdown links work, e.g. [paper](https://arxiv.org/abs/...).
      placeholder: One factual sentence
    validations:
      required: true
