<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Subrata Pramanik — Computer Vision and Pattern Recognition researcher">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#150E3A"/><stop offset="52%" stop-color="#241560"/><stop offset="100%" stop-color="#16104C"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9BE7FF"/><stop offset="52%" stop-color="#C4A6FF"/><stop offset="100%" stop-color="#FFBEDC"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D5AF7"/><stop offset="100%" stop-color="#22C9E8"/>
  </linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#6D5AF7" stop-opacity=".6"/><stop offset="1" stop-color="#6D5AF7" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#22C9E8" stop-opacity=".42"/><stop offset="1" stop-color="#22C9E8" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop offset="0" stop-color="#F65C8E" stop-opacity=".3"/><stop offset="1" stop-color="#F65C8E" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#fff" opacity=".11"/></pattern>
  <clipPath id="round"><rect width="1200" height="340" rx="24"/></clipPath>
  <clipPath id="frame"><rect x="828" y="74" width="196" height="196" rx="14"/></clipPath>
  <style>
    .f{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'DejaVu Sans Mono',Consolas,monospace}
    @keyframes rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,-18px)}}
    @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,16px)}}
    @keyframes wipe{0%{width:0}100%{width:296px}}
    @keyframes scan{0%{transform:translateY(0)}100%{transform:translateY(178px)}}
    @keyframes flow{to{stroke-dashoffset:-36}}
    @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
    #b1{animation:drift 14s ease-in-out infinite}
    #b2{animation:drift2 17s ease-in-out infinite}
    #b3{animation:drift 20s ease-in-out infinite}
    #l1{animation:rise .8s cubic-bezier(.2,.7,.25,1) .05s both}
    #l2{animation:rise .8s cubic-bezier(.2,.7,.25,1) .2s both}
    #l3{animation:rise .8s cubic-bezier(.2,.7,.25,1) .34s both}
    #l4{animation:rise .8s cubic-bezier(.2,.7,.25,1) .5s both}
    #l5{animation:rise .8s cubic-bezier(.2,.7,.25,1) .66s both}
    #uline{animation:wipe 1s cubic-bezier(.2,.7,.25,1) .55s both}
    #scan{animation:scan 3.4s ease-in-out infinite alternate}
    .wire{stroke-dasharray:7 11;animation:flow 1.6s linear infinite}
    .cur{animation:blink 1.1s step-end infinite}
    .cell{animation:glow 3s ease-in-out infinite}
  </style>
</defs>

<g clip-path="url(#round)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <circle id="b1" cx="120" cy="30" r="250" fill="url(#g1)"/>
  <circle id="b2" cx="1120" cy="320" r="260" fill="url(#g2)"/>
  <circle id="b3" cx="640" cy="360" r="220" fill="url(#g3)"/>

  <!-- right: a vision model looking at an image -->
  <g>
    <rect x="828" y="74" width="196" height="196" rx="14" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.22)"/>
    <g clip-path="url(#frame)">
      <rect x="828" y="74" width="196" height="196" fill="#F4F2FF"/>
      <rect x="846" y="90" width="120" height="13" rx="4" fill="#B7B0DC"/>
      <g fill="#DAD5EE">
        <rect x="846" y="116" width="160" height="7" rx="3.5"/><rect x="846" y="130" width="148" height="7" rx="3.5"/>
        <rect x="846" y="144" width="160" height="7" rx="3.5"/><rect x="846" y="158" width="104" height="7" rx="3.5"/>
      </g>
      <g stroke="#C2BBE4" fill="none"><rect x="846" y="178" width="86" height="52" rx="4"/><path d="M846 195 H932 M846 212 H932 M875 178 V230 M904 178 V230"/></g>
      <g><rect x="944" y="178" width="62" height="52" rx="5" fill="#E4E0F7"/><circle cx="962" cy="193" r="7" fill="#F7C86B"/>
         <path d="M944 220 L962 202 L976 214 L1006 190 L1006 230 L944 230 Z" fill="#BFB8E8"/></g>
      <g fill="#DAD5EE"><rect x="846" y="242" width="160" height="7" rx="3.5"/></g>
      <g fill="none" stroke-width="2">
        <rect x="842" y="86" width="128" height="21" rx="3" stroke="#6D5AF7"/>
        <rect x="842" y="111" width="168" height="58" rx="3" stroke="#22C9E8"/>
        <rect x="842" y="174" width="94" height="60" rx="3" stroke="#22C58B"/>
        <rect x="940" y="174" width="70" height="60" rx="3" stroke="#F7A93B"/>
      </g>
      <g id="scan"><rect x="828" y="74" width="196" height="14" fill="url(#rule)" opacity=".5"/></g>
    </g>
    <text class="m" x="828" y="292" font-size="10.5" letter-spacing="1.8" fill="#8F88C4">LAYOUT · RETRIEVE · GROUND</text>
  </g>

  <!-- tiny network between text and image -->
  <g transform="translate(700,110)">
    <g class="wire" stroke="#8B7BFF" stroke-width="1.5" fill="none" opacity=".8">
      <path d="M10 20 C46 20 46 60 82 60"/><path d="M10 60 C46 60 46 20 82 20"/>
      <path d="M10 100 C46 100 46 60 82 60"/>
    </g>
    <g fill="#0F0A2E" stroke="#22C9E8" stroke-width="1.6">
      <circle class="cell" cx="10" cy="20" r="8"/><circle class="cell" cx="10" cy="60" r="8" style="animation-delay:.5s"/>
      <circle class="cell" cx="10" cy="100" r="8" style="animation-delay:1s"/>
      <circle class="cell" cx="82" cy="20" r="8" style="animation-delay:.3s"/><circle class="cell" cx="82" cy="60" r="8" style="animation-delay:.8s"/>
    </g>
  </g>

  <!-- left: identity -->
  <g id="l1"><text class="m" x="64" y="76" font-size="13" letter-spacing="3" fill="#9C93D6">&gt; whoami<tspan class="cur" fill="#22C9E8">_</tspan></text></g>
  <text id="l2" class="f" x="62" y="146" font-size="54" font-weight="700" letter-spacing="-1.7" fill="#F7F4FF">Subrata Pramanik</text>
  <text id="l3" class="f" x="64" y="196" font-size="25" font-weight="600" letter-spacing="-.4" fill="url(#ink)">Computer Vision · Pattern Recognition</text>
  <rect id="uline" x="64" y="212" height="4" rx="2" fill="url(#rule)"/>
  <text id="l4" class="f" x="64" y="252" font-size="16.5" fill="#C3BEE8">Researcher, IIIT Allahabad · Ex-TCS · Kolkata, India</text>

  <g id="l5">
    <g fill="rgba(255,255,255,.09)" stroke="rgba(255,255,255,.22)">
      <rect x="64"  y="272" width="176" height="34" rx="17"/>
      <rect x="250" y="272" width="150" height="34" rx="17"/>
      <rect x="410" y="272" width="216" height="34" rx="17"/>
    </g>
    <g class="m" font-size="11.5" letter-spacing="1.6" fill="#E2DEFF">
      <text x="86"  y="294">IIIT ALLAHABAD</text>
      <text x="272" y="294">RESEARCHER</text>
      <text x="430" y="294">PATTERN RECOGNITION</text>
    </g>
  </g>
</g>
</svg>
