<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 26" width="1200" height="26" role="img" aria-label="">
<defs>
  <linearGradient id="rl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D5AF7" stop-opacity="0"/>
    <stop offset="18%" stop-color="#6D5AF7" stop-opacity=".9"/>
    <stop offset="50%" stop-color="#22C9E8" stop-opacity="1"/>
    <stop offset="82%" stop-color="#F65C8E" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#F65C8E" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <style>
    @keyframes run{0%{transform:translateX(-260px)}100%{transform:translateX(1210px)}}
    @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
    #s{animation:run 5.5s linear infinite}
    .d{animation:twinkle 3.4s ease-in-out infinite}
  </style>
</defs>
  <rect x="0" y="12" width="1200" height="2" rx="1" fill="url(#rl)"/>
  <g id="s"><rect x="0" y="11.5" width="240" height="3" rx="1.5" fill="url(#sh)" opacity=".8"/></g>
  <circle class="d" cx="300" cy="13" r="2.4" fill="#6D5AF7"/>
  <circle class="d" cx="600" cy="13" r="3" fill="#22C9E8" style="animation-delay:1.1s"/>
  <circle class="d" cx="900" cy="13" r="2.4" fill="#F65C8E" style="animation-delay:2.2s"/>
</svg>
