<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="presentation">
<defs>
  <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D5AF7" stop-opacity="0"/><stop offset="18%" stop-color="#6D5AF7"/>
    <stop offset="50%" stop-color="#22C9E8"/><stop offset="82%" stop-color="#F65C8E"/>
    <stop offset="100%" stop-color="#F65C8E" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".85"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <style>
    @keyframes run{0%{transform:translateX(-260px)}100%{transform:translateX(1200px)}}
    #g{animation:run 3.2s linear infinite}
  </style>
</defs>
<rect x="0" y="3" width="1200" height="4" rx="2" fill="url(#d)"/>
<rect id="g" x="0" y="3" width="260" height="4" rx="2" fill="url(#sh)"/>
</svg>
