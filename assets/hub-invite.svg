<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="The Learning Hub — everything I am learning, written up in one place. Free, open source, no sign-up. Click to start reading.">
<title>Open the Learning Hub</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0A0620"/><stop offset="50%" stop-color="#151038"/><stop offset="100%" stop-color="#0A0620"/>
</linearGradient>
<radialGradient id="halo" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#2ED8F7" stop-opacity="0.22"/><stop offset="100%" stop-color="#2ED8F7" stop-opacity="0"/>
</radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#2ED8F7"/><stop offset="100%" stop-color="#2ED8F7" stop-opacity="0"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8B6BFF" stroke-opacity="0.09" stroke-width="1"/></pattern>
<clipPath id="cp"><rect width="1200" height="300" rx="22"/></clipPath>
<style>
.fl{stroke-dasharray:8 8;animation:fl 1.2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-32}}
.hz{animation:drift 20s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-16px) scale(1.12)}}
.dt{animation:br 2.2s ease-in-out infinite}.dt.b{animation-delay:.35s}.dt.c{animation-delay:.7s}
@keyframes br{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
