.hz{filter:url(#sf);transform-box:fill-box;transform-origin:center;animation:dr 18s ease-in-out infinite}
@keyframes dr{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(120px,40px) scale(1.25)}}
.rl{stroke-dasharray:520;stroke-dashoffset:520;animation:dw 2s .3s ease-out forwards}
@keyframes dw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important}.rl{stroke-dashoffset:0}}
</style>
