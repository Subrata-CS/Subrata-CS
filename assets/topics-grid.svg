.ka .bx,.ka .eg{stroke:#6D5AF7}.ka .eg,.ka .nu,.ka .pp,.ka .lg{fill:#6D5AF7}.ka .nm,.ka .lb{fill:#CFC6FF}
.kb .bx,.kb .eg{stroke:#22C9E8}.kb .eg,.kb .nu,.kb .pp,.kb .lg{fill:#22C9E8}.kb .nm,.kb .lb{fill:#A9EEFA}
