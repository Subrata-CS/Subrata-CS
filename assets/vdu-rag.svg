<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"
     aria-label="Visual document understanding with retrieval augmented generation: a document page is encoded, retrieved against, and answered with a citation back to the page">
<defs>
  <linearGradient id="rl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6D5AF7"/><stop offset="100%" stop-color="#22C9E8"/></linearGradient>
  <linearGradient id="gr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22C58B"/><stop offset="100%" stop-color="#22C9E8"/></linearGradient>
  <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7A93B"/><stop offset="100%" stop-color="#F65C8E"/></linearGradient>
  <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8F9FE"/><stop offset="100%" stop-color="#ECEFFB"/></linearGradient>
  <marker id="ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 z" fill="#22C58B"/></marker>
  <clipPath id="cardclip"><rect width="1200" height="300" rx="20"/></clipPath>
  <clipPath id="page"><rect x="46" y="76" width="138" height="148" rx="8"/></clipPath>
  <clipPath id="patchclip"><rect x="242" y="86" width="126" height="128" rx="8"/></clipPath>
  <style>
    .f{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'DejaVu Sans Mono',Consolas,monospace}
    @keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(132px)}}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes glow{0%,100%{opacity:.18}50%{opacity:1}}
    @keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
    @keyframes pop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
    @keyframes ring{0%,100%{opacity:.25;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
    #sweep{animation:sweep 3s ease-in-out infinite alternate}
    .wire{stroke-dasharray:6 9;animation:flow 1.5s linear infinite}
    .patch{animation:glow 2.6s ease-in-out infinite}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.3s cubic-bezier(.2,.7,.25,1) both}
    .in{animation:pop .7s cubic-bezier(.2,.7,.25,1) both}
    .hit{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-in-out infinite}
  </style>
</defs>

<g clip-path="url(#cardclip)">
<rect width="1200" height="300" fill="url(#soft)"/>
<g stroke="#DEE3F5"><path d="M0 70 H1200"/><path d="M0 238 H1200"/></g>

<!-- ══ 01 · the document page ══ -->
<text class="f" x="40" y="56" font-size="13.5" font-weight="600" fill="#3B4266">Document page</text>
<rect x="40" y="70" width="150" height="160" rx="12" fill="#fff" stroke="#CFD6EE"/>
<g clip-path="url(#page)">
  <rect x="46" y="76" width="138" height="148" fill="#fff"/>
  <!-- title block -->
  <rect x="58" y="86" width="86" height="9" rx="3" fill="#B9BFDC"/>
  <!-- paragraph lines -->
  <g fill="#DCE0EF">
    <rect x="58" y="106" width="114" height="5" rx="2.5"/><rect x="58" y="116" width="106" height="5" rx="2.5"/>
    <rect x="58" y="126" width="114" height="5" rx="2.5"/><rect x="58" y="136" width="72" height="5" rx="2.5"/>
  </g>
  <!-- table -->
  <g stroke="#C7CEE8" fill="none"><rect x="58" y="152" width="66" height="40" rx="3"/><path d="M58 165 H124 M58 179 H124 M80 152 V192 M102 152 V192"/></g>
  <!-- figure -->
  <g><rect x="132" y="152" width="40" height="40" rx="4" fill="#E7EBF9"/><circle cx="145" cy="164" r="5" fill="#F7C86B"/><path d="M132 186 L146 172 L156 180 L172 166 L172 192 L132 192 Z" fill="#BAC4EA"/></g>
  <g fill="#DCE0EF"><rect x="58" y="202" width="114" height="5" rx="2.5"/><rect x="58" y="212" width="88" height="5" rx="2.5"/></g>
  <!-- detected layout regions -->
  <g fill="none" stroke-width="1.8">
    <rect x="55" y="82" width="92" height="17" rx="3" stroke="#6D5AF7"/>
    <rect x="55" y="101" width="120" height="45" rx="3" stroke="#22C9E8"/>
    <rect x="55" y="149" width="72" height="46" rx="3" stroke="#22C58B"/>
    <rect x="129" y="149" width="46" height="46" rx="3" stroke="#F7A93B"/>
  </g>
  <g id="sweep"><rect x="46" y="72" width="138" height="12" fill="url(#rl)" opacity=".45"/></g>
</g>
<text class="m" x="40" y="258" font-size="11" letter-spacing="1.3" fill="#6D5AF7">01 · LAYOUT</text>

<path class="wire" d="M198 150 H232" stroke="#9B8CFA" stroke-width="2.2" fill="none"/>

<!-- ══ 02 · patch encoder ══ -->
<text class="f" x="236" y="56" font-size="13.5" font-weight="600" fill="#3B4266">Vision encoder</text>
<rect x="236" y="70" width="138" height="160" rx="12" fill="#fff" stroke="#CFD6EE"/>
<g clip-path="url(#patchclip)">
  <g stroke="#E3E7F7" fill="#F6F8FE">
    <rect x="242" y="86" width="126" height="98"/>
  </g>
  <g fill="#6D5AF7">
    <rect class="patch" x="246"  y="90"  width="26" height="26" rx="4"/>
    <rect class="patch" x="276" y="90"  width="26" height="26" rx="4" style="animation-delay:.25s"/>
    <rect class="patch" x="306" y="90"  width="26" height="26" rx="4" style="animation-delay:.5s"/>
    <rect class="patch" x="336" y="90"  width="26" height="26" rx="4" style="animation-delay:.75s"/>
    <rect class="patch" x="246"  y="120" width="26" height="26" rx="4" style="animation-delay:.4s"/>
    <rect class="patch" x="276" y="120" width="26" height="26" rx="4" style="animation-delay:.9s"/>
    <rect class="patch" x="306" y="120" width="26" height="26" rx="4" style="animation-delay:.15s"/>
    <rect class="patch" x="336" y="120" width="26" height="26" rx="4" style="animation-delay:.65s"/>
    <rect class="patch" x="246"  y="150" width="26" height="26" rx="4" style="animation-delay:1.1s"/>
    <rect class="patch" x="276" y="150" width="26" height="26" rx="4" style="animation-delay:.3s"/>
    <rect class="patch" x="306" y="150" width="26" height="26" rx="4" style="animation-delay:.8s"/>
    <rect class="patch" x="336" y="150" width="26" height="26" rx="4" style="animation-delay:.55s"/>
  </g>
  <g stroke="#fff" stroke-width="2">
    <path d="M276 86 V184"/><path d="M306 86 V184"/><path d="M336 86 V184"/>
    <path d="M242 116 H368"/><path d="M242 146 H368"/>
  </g>
</g>
<text class="m" x="246" y="204" font-size="9.5" letter-spacing="1.1" fill="#8A92AC">PATCH EMBEDDINGS</text>
<g fill="url(#rl)">
  <rect class="in" x="246" y="212" width="16" height="9" rx="3"/>
  <rect class="in" x="266" y="212" width="16" height="9" rx="3" style="animation-delay:.15s"/>
  <rect class="in" x="286" y="212" width="16" height="9" rx="3" style="animation-delay:.3s"/>
  <rect class="in" x="306" y="212" width="16" height="9" rx="3" style="animation-delay:.45s"/>
  <rect class="in" x="326" y="212" width="16" height="9" rx="3" style="animation-delay:.6s"/>
  <rect class="in" x="346" y="212" width="16" height="9" rx="3" style="animation-delay:.75s"/>
</g>
<text class="m" x="236" y="258" font-size="11" letter-spacing="1.3" fill="#22A8E8">02 · ENCODE</text>

<path class="wire" d="M382 150 H416" stroke="#9B8CFA" stroke-width="2.2" fill="none"/>

<!-- ══ 03 · retrieval ══ -->
<text class="f" x="420" y="56" font-size="13.5" font-weight="600" fill="#3B4266">Retrieve — top-k passages</text>
<rect x="420" y="70" width="300" height="160" rx="12" fill="#fff" stroke="#CFD6EE"/>
<g class="in">
  <rect x="436" y="84" width="150" height="26" rx="13" fill="#EEEBFE" stroke="#C9C0FB"/>
  <text class="m" x="450" y="101" font-size="10" fill="#5849C8">query · “the total?”</text>
</g>
<g class="m" font-size="9" letter-spacing="1" fill="#9AA1BC"><text x="600" y="101">SIMILARITY</text></g>
<g>
  <!-- index rows -->
  <g fill="#F5F7FD" stroke="#E3E7F7">
    <rect x="436" y="122" width="268" height="20" rx="6"/>
    <rect x="436" y="146" width="268" height="20" rx="6"/>
    <rect x="436" y="170" width="268" height="20" rx="6"/>
    <rect x="436" y="194" width="268" height="20" rx="6"/>
  </g>
  <!-- matched rows -->
  <g class="hit"><rect x="436" y="122" width="268" height="20" rx="6" fill="#E6FAF3" stroke="#22C58B" stroke-width="1.6"/></g>
  <g class="hit" style="animation-delay:1.2s"><rect x="436" y="170" width="268" height="20" rx="6" fill="#E6FAF3" stroke="#22C58B" stroke-width="1.6"/></g>
  <g class="m" font-size="9.5" fill="#5B6178">
    <text x="446" y="136">page 1 · table cell</text><text x="446" y="160">page 1 · paragraph</text>
    <text x="446" y="184">page 2 · figure caption</text><text x="446" y="208">page 3 · heading</text>
  </g>
  <!-- scores -->
  <g>
    <rect x="620" y="128" width="74" height="7" rx="3.5" fill="#EAEDF9"/><rect class="bar" x="620" y="128" width="68" height="7" rx="3.5" fill="url(#gr)"/>
    <rect x="620" y="152" width="74" height="7" rx="3.5" fill="#EAEDF9"/><rect class="bar" x="620" y="152" width="30" height="7" rx="3.5" fill="#C3CBE4" style="animation-delay:.2s"/>
    <rect x="620" y="176" width="74" height="7" rx="3.5" fill="#EAEDF9"/><rect class="bar" x="620" y="176" width="54" height="7" rx="3.5" fill="url(#gr)" style="animation-delay:.4s"/>
    <rect x="620" y="200" width="74" height="7" rx="3.5" fill="#EAEDF9"/><rect class="bar" x="620" y="200" width="18" height="7" rx="3.5" fill="#C3CBE4" style="animation-delay:.6s"/>
  </g>
</g>
<text class="m" x="420" y="258" font-size="11" letter-spacing="1.3" fill="#1DBE86">03 · RETRIEVE</text>

<path class="wire" d="M728 150 H762" stroke="#9B8CFA" stroke-width="2.2" fill="none"/>

<!-- ══ 04 · grounded generation ══ -->
<text class="f" x="766" y="56" font-size="13.5" font-weight="600" fill="#3B4266">Grounded answer</text>
<rect x="766" y="70" width="394" height="160" rx="12" fill="#fff" stroke="#CFD6EE"/>
<g class="in" style="animation-delay:.6s">
  <rect x="782" y="84" width="120" height="24" rx="12" fill="#FDEFF4" stroke="#F7BDD0"/>
  <text class="m" x="794" y="100" font-size="10" fill="#C7386A">generator · LLM</text>
</g>
<g fill="#DCE0EF">
  <rect class="bar" x="782" y="124" width="352" height="8" rx="4" style="animation-delay:.7s"/>
  <rect class="bar" x="782" y="140" width="318" height="8" rx="4" style="animation-delay:.85s"/>
  <rect class="bar" x="782" y="156" width="340" height="8" rx="4" style="animation-delay:1s"/>
  <rect class="bar" x="782" y="172" width="204" height="8" rx="4" style="animation-delay:1.15s"/>
</g>
<g class="in" style="animation-delay:1.5s">
  <rect x="782" y="192" width="152" height="24" rx="7" fill="#E6FAF3" stroke="#22C58B"/>
  <text class="m" x="794" y="208" font-size="10" fill="#128A61">cited · page 1, table</text>
  <path class="wire" d="M940 204 C1000 204 1010 190 1054 190" stroke="#22C58B" stroke-width="1.8" fill="none" marker-end="url(#ah)"/>
  <text class="m" x="1062" y="194" font-size="9.5" letter-spacing="1" fill="#1DBE86">GROUNDED</text>
</g>
<text class="m" x="766" y="258" font-size="11" letter-spacing="1.3" fill="#F1567F">04 · GENERATE</text>
</g>
</svg>
