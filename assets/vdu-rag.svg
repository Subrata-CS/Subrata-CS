<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Four stage workflow: detect layout regions, encode into patch embeddings, retrieve the top matching regions, then generate a grounded answer with a citation">
<title>Document understanding workflow — layout, encode, retrieve, grounded answer</title>
<defs>
