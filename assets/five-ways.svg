<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Every topic page opens the same six ways: overview, key concepts, example, run your code, practice questions, references">
  <title>Every topic page opens the same six ways — overview, key concepts, example, run your code, practice questions, references</title>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1345"/>
      <stop offset="100%" stop-color="#0C0820"/>
    </linearGradient>
    <linearGradient id="wBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08050F"/>
      <stop offset="52%" stop-color="#120C2C"/>
      <stop offset="100%" stop-color="#08050F"/>
    </linearGradient>
    <pattern id="wGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9B8CFA" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="wClip"><rect width="1200" height="200" rx="20"/></clipPath>
    <style>
      .card { transform-box: fill-box; transform-origin: center; animation: float 6.5s ease-in-out infinite; }
      .c2 { animation-delay: .35s; } .c3 { animation-delay: .7s; }
      .c4 { animation-delay: 1.05s; } .c5 { animation-delay: 1.4s; } .c6 { animation-delay: 1.75s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

      .trace { stroke-dasharray: 120 500; stroke-dashoffset: 620; animation: trace 5s linear infinite; }
      .t2 { animation-delay: .8s; } .t3 { animation-delay: 1.6s; }
      .t4 { animation-delay: 2.4s; } .t5 { animation-delay: 3.2s; } .t6 { animation-delay: 4s; }
      @keyframes trace { to { stroke-dashoffset: 0; } }

      .pip { animation: pip 2.6s ease-in-out infinite; }
      @keyframes pip { 0%,100% { opacity:.3; } 50% { opacity:1; } }

      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }

      .lbl { font-family: 'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .3px; }
      .sub { font-family: 'JetBrains Mono',ui-monospace,monospace; font-size: 9px; letter-spacing: 1.3px; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trace { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <g clip-path="url(#wClip)">
    <rect width="1200" height="200" fill="url(#wBg)"/>
    <rect width="1200" height="200" fill="url(#wGrid)"/>

    <!-- 1 · overview -->
    <g class="card"><g transform="translate(14,30)">
      <rect width="186" height="140" rx="14" fill="url(#cardBg)" stroke="#6D5AF7" stroke-opacity="0.45"/>
      <rect class="trace" width="186" height="140" rx="14" fill="none" stroke="#9B8CFA" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(22,24)">
        <rect width="28" height="34" rx="4" fill="none" stroke="#9B8CFA" stroke-width="2"/>
        <path d="M7 10h14 M7 18h14 M7 26h9" stroke="#6D5AF7" stroke-width="2" stroke-linecap="round"/>
      </g>
      <circle class="pip" cx="164" cy="24" r="3.2" fill="#6D5AF7"/>
      <text class="lbl" x="22" y="102" fill="#EDE9FF">Overview</text>
      <text class="sub" x="22" y="122" fill="#7C6FB8">WHAT IT IS, IN SHORT</text>
    </g></g>

    <!-- 2 · key concepts -->
    <g class="card c2"><g transform="translate(212,30)">
      <rect width="186" height="140" rx="14" fill="url(#cardBg)" stroke="#22C9E8" stroke-opacity="0.45"/>
      <rect class="trace t2" width="186" height="140" rx="14" fill="none" stroke="#7FE6FF" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(22,24)" fill="none" stroke="#7FE6FF" stroke-width="2" stroke-linecap="round">
        <circle cx="7" cy="8" r="3.4"/><path d="M16 8h18"/>
        <circle cx="7" cy="20" r="3.4"/><path d="M16 20h24"/>
        <circle cx="7" cy="32" r="3.4"/><path d="M16 32h14"/>
      </g>
      <circle class="pip" cx="164" cy="24" r="3.2" fill="#22C9E8"/>
      <text class="lbl" x="22" y="102" fill="#EDE9FF">Key Concepts</text>
      <text class="sub" x="22" y="122" fill="#7C6FB8">THE IDEAS THAT MATTER</text>
    </g></g>

    <!-- 3 · example -->
    <g class="card c3"><g transform="translate(410,30)">
      <rect width="186" height="140" rx="14" fill="url(#cardBg)" stroke="#22C58B" stroke-opacity="0.45"/>
      <rect class="trace t3" width="186" height="140" rx="14" fill="none" stroke="#8DE8C0" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(22,24)">
        <rect width="44" height="34" rx="5" fill="#08050F" stroke="#22C58B" stroke-width="2"/>
        <path d="M9 12l6 5-6 5" fill="none" stroke="#8DE8C0" stroke-width="2" stroke-linecap="round"/>
        <path d="M22 22h12" stroke="#8DE8C0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
      </g>
      <circle class="pip" cx="164" cy="24" r="3.2" fill="#22C58B"/>
      <text class="lbl" x="22" y="102" fill="#EDE9FF">Example</text>
      <text class="sub" x="22" y="122" fill="#7C6FB8">WORKED, WITH OUTPUT</text>
    </g></g>

    <!-- 4 · run your code -->
    <g class="card c4"><g transform="translate(608,30)">
      <rect width="186" height="140" rx="14" fill="url(#cardBg)" stroke="#F7A93B" stroke-opacity="0.5"/>
      <rect class="trace t4" width="186" height="140" rx="14" fill="none" stroke="#F7A93B" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(22,24)">
        <rect width="44" height="34" rx="5" fill="#08050F" stroke="#F7A93B" stroke-width="2"/>
        <path d="M9 12l6 5-6 5" fill="none" stroke="#F6864F" stroke-width="2" stroke-linecap="round"/>
        <rect class="cursor" x="20" y="15" width="12" height="4" rx="2" fill="#F7A93B"/>
        <circle class="pip" cx="52" cy="4" r="5" fill="#22C58B"/>
      </g>
      <circle class="pip" cx="164" cy="24" r="3.2" fill="#F7A93B"/>
      <text class="lbl" x="22" y="102" fill="#EDE9FF">Run your code</text>
      <text class="sub" x="22" y="122" fill="#7C6FB8">IN THE BROWSER</text>
    </g></g>

    <!-- 5 · practice -->
    <g class="card c5"><g transform="translate(806,30)">
      <rect width="186" height="140" rx="14" fill="url(#cardBg)" stroke="#9B5CF6" stroke-opacity="0.5"/>
      <rect class="trace t5" width="186" height="140" rx="14" fill="none" stroke="#C4A9FF" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(22,24)" fill="none" stroke="#C4A9FF" stroke-width="2" stroke-linecap="round">
        <rect x="0" y="0" width="34" height="38" rx="4"/>
        <path d="M8 12h18 M8 21h18 M8 30h10"/>
        <path d="M28 26l5 5 9-11" stroke="#22C58B" stroke-width="2.6"/>
      </g>
      <circle class="pip" cx="164" cy="24" r="3.2" fill="#9B5CF6"/>
      <text class="lbl" x="22" y="102" fill="#EDE9FF">Practice</text>
      <text class="sub" x="22" y="122" fill="#7C6FB8">QUESTIONS TO TRY</text>
    </g></g>

    <!-- 6 · references -->
    <g class="card c6"><g transform="translate(1004,30)">
      <rect width="186" height="140" rx="14" fill="url(#cardBg)" stroke="#F65C8E" stroke-opacity="0.5"/>
      <rect class="trace t6" width="186" height="140" rx="14" fill="none" stroke="#F65C8E" stroke-width="2" stroke-linecap="round"/>
      <g transform="translate(22,24)" fill="none" stroke-width="2">
        <rect y="6" width="12" height="32" rx="3" stroke="#F65C8E"/>
        <rect x="16" y="2" width="12" height="36" rx="3" stroke="#9B5CF6"/>
        <rect x="32" y="10" width="12" height="28" rx="3" stroke="#F7A93B"/>
      </g>
      <circle class="pip" cx="164" cy="24" r="3.2" fill="#F65C8E"/>
      <text class="lbl" x="22" y="102" fill="#EDE9FF">References</text>
      <text class="sub" x="22" y="122" fill="#7C6FB8">WHERE TO GO NEXT</text>
    </g></g>

    <rect x="0.5" y="0.5" width="1199" height="199" rx="20" fill="none" stroke="#6D5AF7" stroke-opacity="0.3"/>
  </g>
</svg>
