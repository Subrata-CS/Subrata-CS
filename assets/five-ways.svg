<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 196" width="1200" height="196" role="img" aria-label="Every topic opens the same five ways: description, notes, tutorials, run your code, projects">
  <title>Every topic opens the same five ways — description, notes, tutorials, run your code, projects</title>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1345"/>
      <stop offset="100%" stop-color="#0C0820"/>
    </linearGradient>
    <style>
      .card { transform-box: fill-box; transform-origin: center; animation: float 6.5s ease-in-out infinite; }
      .c2 { animation-delay: .5s; } .c3 { animation-delay: 1s; } .c4 { animation-delay: 1.5s; } .c5 { animation-delay: 2s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

      .trace { stroke-dasharray: 130 590; stroke-dashoffset: 720; animation: trace 5s linear infinite; }
      .t2 { animation-delay: 1s; } .t3 { animation-delay: 2s; } .t4 { animation-delay: 3s; } .t5 { animation-delay: 4s; }
      @keyframes trace { to { stroke-dashoffset: 0; } }

      .glyph { transform-box: fill-box; transform-origin: center; }
      .g1 { animation: nod 3.4s ease-in-out infinite; }
      @keyframes nod { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .g2 { animation: tilt 5s ease-in-out infinite; }
      @keyframes tilt { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
      .g3 { animation: spin 8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .g4 { animation: beat 1.9s ease-in-out infinite; }
      @keyframes beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.16); } }
      .g5 { animation: shift 4.2s ease-in-out infinite; }
      @keyframes shift { 0%,100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }

      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trace { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <g font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">

    <!-- 1 · description -->
    <g class="card">
      <g transform="translate(18,28)">
        <rect width="216" height="140" rx="16" fill="url(#cardBg)" stroke="#6D5AF7" stroke-opacity="0.45"/>
        <rect class="trace" width="216" height="140" rx="16" fill="none" stroke="#9B8CFA" stroke-width="2" stroke-linecap="round"/>
        <g class="glyph g1" transform="translate(28,30)">
          <rect width="30" height="38" rx="4" fill="none" stroke="#9B8CFA" stroke-width="2"/>
          <path d="M7 10h16 M7 19h16 M7 28h10" stroke="#6D5AF7" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="28" y="106" font-size="16" font-weight="700" letter-spacing="0.6" fill="#EDE9FF">Description</text>
        <text x="28" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#7C6FB8">WHAT IT IS, IN SHORT</text>
      </g>
    </g>

    <!-- 2 · notes -->
    <g class="card c2">
      <g transform="translate(255,28)">
        <rect width="216" height="140" rx="16" fill="url(#cardBg)" stroke="#22C9E8" stroke-opacity="0.45"/>
        <rect class="trace t2" width="216" height="140" rx="16" fill="none" stroke="#7FE6FF" stroke-width="2" stroke-linecap="round"/>
        <g class="glyph g2" transform="translate(28,30)">
          <rect width="34" height="38" rx="4" fill="none" stroke="#7FE6FF" stroke-width="2"/>
          <path d="M8 11h18 M8 20h18 M8 29h12" stroke="#22C9E8" stroke-width="2" stroke-linecap="round"/>
          <path d="M26 4l6 6-6 6" fill="none" stroke="#F7A93B" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
        </g>
        <text x="28" y="106" font-size="16" font-weight="700" letter-spacing="0.6" fill="#EDE9FF">Notes</text>
        <text x="28" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#7C6FB8">THE FULL WRITE-UP</text>
      </g>
    </g>

    <!-- 3 · tutorials -->
    <g class="card c3">
      <g transform="translate(492,28)">
        <rect width="216" height="140" rx="16" fill="url(#cardBg)" stroke="#22C58B" stroke-opacity="0.45"/>
        <rect class="trace t3" width="216" height="140" rx="16" fill="none" stroke="#8DE8C0" stroke-width="2" stroke-linecap="round"/>
        <g class="glyph g3" transform="translate(30,30)">
          <circle cx="17" cy="19" r="17" fill="none" stroke="#22C58B" stroke-width="2" stroke-dasharray="7 6"/>
          <path d="M12 11l14 8-14 8z" fill="#8DE8C0"/>
        </g>
        <text x="28" y="106" font-size="16" font-weight="700" letter-spacing="0.6" fill="#EDE9FF">Tutorials</text>
        <text x="28" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#7C6FB8">STEP BY STEP</text>
      </g>
    </g>

    <!-- 4 · run your code -->
    <g class="card c4">
      <g transform="translate(729,28)">
        <rect width="216" height="140" rx="16" fill="url(#cardBg)" stroke="#F7A93B" stroke-opacity="0.5"/>
        <rect class="trace t4" width="216" height="140" rx="16" fill="none" stroke="#F7A93B" stroke-width="2" stroke-linecap="round"/>
        <g transform="translate(28,28)">
          <rect width="44" height="34" rx="5" fill="#08050F" stroke="#F7A93B" stroke-width="2"/>
          <path d="M9 12l6 5-6 5" fill="none" stroke="#F6864F" stroke-width="2" stroke-linecap="round"/>
          <rect class="cursor" x="20" y="15" width="12" height="4" rx="2" fill="#F7A93B"/>
          <g class="glyph g4" transform="translate(36,-8)">
            <circle r="6" fill="#22C58B" fill-opacity="0.9"/>
          </g>
        </g>
        <text x="28" y="106" font-size="16" font-weight="700" letter-spacing="0.6" fill="#EDE9FF">Run your code</text>
        <text x="28" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#7C6FB8">IN THE BROWSER</text>
      </g>
    </g>

    <!-- 5 · projects -->
    <g class="card c5">
      <g transform="translate(966,28)">
        <rect width="216" height="140" rx="16" fill="url(#cardBg)" stroke="#F65C8E" stroke-opacity="0.5"/>
        <rect class="trace t5" width="216" height="140" rx="16" fill="none" stroke="#F65C8E" stroke-width="2" stroke-linecap="round"/>
        <g class="glyph g5" transform="translate(28,30)">
          <rect y="8" width="14" height="30" rx="3" fill="none" stroke="#F65C8E" stroke-width="2"/>
          <rect x="18" y="2" width="14" height="36" rx="3" fill="none" stroke="#9B5CF6" stroke-width="2"/>
          <rect x="36" y="14" width="14" height="24" rx="3" fill="none" stroke="#F7A93B" stroke-width="2"/>
        </g>
        <text x="28" y="106" font-size="16" font-weight="700" letter-spacing="0.6" fill="#EDE9FF">Projects</text>
        <text x="28" y="126" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#7C6FB8">BUILD IT YOURSELF</text>
      </g>
    </g>
  </g>
</svg>
