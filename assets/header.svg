<rect x="306" y="296" width="148" height="40" rx="10" fill="#221A55" stroke="#2ED8F7" stroke-width="1.5"/>
<text x="326" y="323" fill="#9AEEFF">EX-TCSer</text>
<rect x="466" y="296" width="192" height="40" rx="10" fill="#221A55" stroke="#2FDCA0" stroke-width="1.5"/>
<text x="486" y="323" fill="#9AF0CE">OPEN SOURCE</text>
</g>

<rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="26" fill="none" stroke="#8B6BFF" stroke-opacity="0.55" stroke-width="1.5"/>
</g>
