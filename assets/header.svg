<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Subrata Pramanik, Research Scholar in Computer Vision and Pattern Recognition, IIIT Allahabad, formerly TCS">
<title>Subrata Pramanik — Research Scholar, Computer Vision and Pattern Recognition, IIIT Allahabad</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0A0620"/><stop offset="50%" stop-color="#151038"/><stop offset="100%" stop-color="#0A0620"/>
</linearGradient>
<radialGradient id="gl" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#2ED8F7" stop-opacity="0.30"/><stop offset="100%" stop-color="#2ED8F7" stop-opacity="0"/>
</radialGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#8B6BFF"/><stop offset="60%" stop-color="#2ED8F7"/><stop offset="100%" stop-color="#2ED8F7" stop-opacity="0"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8B6BFF" stroke-opacity="0.09" stroke-width="1"/></pattern>
<clipPath id="cp"><rect width="1200" height="380" rx="26"/></clipPath>
<style>
.net{transform-box:fill-box;transform-origin:center;animation:spin 46s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live{animation:beat 2s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
.hz{animation:drift 18s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,24px) scale(1.15)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#cp)">
<rect width="1200" height="380" fill="url(#bg)"/>
<rect width="1200" height="380" fill="url(#grid)"/>
<ellipse class="hz" cx="960" cy="200" rx="300" ry="220" fill="url(#gl)"/>

<!-- decorative network, kept clear of all text -->
<g transform="translate(1010,196)" class="net">
<g fill="none" stroke="#B072FF" stroke-opacity="0.45" stroke-width="1.6">
<path d="M-120-84 L-10-44 M-120-84 L-10 40 M-120 0 L-10-44 M-120 0 L-10 104 M-120 84 L-10 40 M-120 84 L-10 104"/>
<path d="M-10-104 L104-56 M-10-44 L104-56 M-10 40 L104 12 M-10 104 L104 76 M-10-44 L104 12 M-10 40 L104-56"/>
</g>
<g fill="#0A0620" stroke="#2ED8F7" stroke-width="2.4">
<circle cx="-120" cy="-84" r="9"/><circle cx="-120" cy="0" r="9"/><circle cx="-120" cy="84" r="9"/>
</g>
<g fill="#0A0620" stroke="#B072FF" stroke-width="2.4">
<circle cx="-10" cy="-104" r="8"/><circle cx="-10" cy="-44" r="8"/><circle cx="-10" cy="40" r="8"/><circle cx="-10" cy="104" r="8"/>
</g>
<g fill="#0A0620" stroke="#2FDCA0" stroke-width="2.4">
<circle cx="104" cy="-56" r="9"/><circle cx="104" cy="12" r="9"/><circle cx="104" cy="76" r="9"/>
</g>
</g>

<!-- identity block on a solid plate so every glyph stays high contrast -->
<rect x="48" y="44" width="778" height="292" rx="20" fill="#171041" fill-opacity="0.92" stroke="#8B6BFF" stroke-opacity="0.5" stroke-width="1.5"/>

<g>
<rect x="74" y="70" width="288" height="42" rx="21" fill="#221A55" stroke="#B072FF" stroke-opacity="0.75" stroke-width="1.5"/>
<circle class="live" cx="98" cy="91" r="6" fill="#2FDCA0"/>
<text x="116" y="98" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,ui-monospace,monospace" font-size="19" font-weight="700" letter-spacing="2.6" fill="#EDE7FF">RESEARCH SCHOLAR</text>
</g>

<text x="74" y="182" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="55" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">SUBRATA PRAMANIK</text>
<path d="M74 204 H800" stroke="url(#rule)" stroke-width="3" stroke-linecap="round"/>

<text x="74" y="244" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#8FEBFF">Computer vision · pattern recognition</text>
<text x="74" y="278" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#8FEBFF">Visual document understanding</text>

<g font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,ui-monospace,monospace" font-size="19" font-weight="700" letter-spacing="1.6">
