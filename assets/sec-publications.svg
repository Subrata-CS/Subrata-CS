<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="1200" height="116" role="img" aria-label="PUBLICATIONS — PEER-REVIEWED WORK AND PREPRINTS">
<title>PUBLICATIONS</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#1C1447"/><stop offset="60%" stop-color="#151038"/><stop offset="100%" stop-color="#0A0620"/>
</linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#FFB645"/><stop offset="100%" stop-color="#FF9256"/>
</linearGradient>
<clipPath id="cp"><rect width="1200" height="116" rx="18"/></clipPath>
<style>
.gl{transform-box:fill-box;transform-origin:center;animation:spin 11s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
.dt{animation:br 2.2s ease-in-out infinite}.dt.b{animation-delay:.35s}.dt.c{animation-delay:.7s}
@keyframes br{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#cp)">
<rect width="1200" height="116" fill="url(#bg)"/>
<rect x="0" y="0" width="10" height="116" fill="url(#ac)" class="bar"/>
<g class="gl" transform="translate(56,58)">
<circle r="18" fill="none" stroke="#FFB645" stroke-width="2.4" stroke-dasharray="8 6"/>
<circle r="7" fill="#FF9256"/>
</g>
<text x="98" y="56" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="3" fill="#FFFFFF">PUBLICATIONS</text>
<path d="M100 70 H470" stroke="#FFB645" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
<text x="100" y="96" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,ui-monospace,monospace" font-size="19" font-weight="600" letter-spacing="2" fill="#C3B8EE">PEER-REVIEWED WORK AND PREPRINTS</text>
<g transform="translate(0,58)" fill="#FF9256">
<circle class="dt" cx="1120" cy="0" r="5"/><circle class="dt b" cx="1142" cy="0" r="5"/><circle class="dt c" cx="1164" cy="0" r="5"/>
</g>
<rect x="0.75" y="0.75" width="1198.5" height="114.5" rx="18" fill="none" stroke="#FFB645" stroke-opacity="0.5" stroke-width="1.5"/>
</g>
</svg>
