<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img"
     aria-label="Subrata Pramanik — Computer Vision and Pattern Recognition, IIIT Allahabad">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D0929"/><stop offset="48%" stop-color="#1B1148"/><stop offset="100%" stop-color="#0E0A2E"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9BE7FF"/><stop offset="52%" stop-color="#C4A6FF"/><stop offset="100%" stop-color="#FFBEDC"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6D5AF7" stop-opacity="0"/><stop offset="50%" stop-color="#22C9E8"/><stop offset="100%" stop-color="#F65C8E" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#6D5AF7" stop-opacity=".55"/><stop offset="1" stop-color="#6D5AF7" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#22C9E8" stop-opacity=".38"/><stop offset="1" stop-color="#22C9E8" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop offset="0" stop-color="#F65C8E" stop-opacity=".3"/><stop offset="1" stop-color="#F65C8E" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.4" fill="#fff" opacity=".08"/></pattern>
  <clipPath id="round"><rect width="1200" height="150" rx="18"/></clipPath>
  <style>
    .f{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'DejaVu Sans Mono',Consolas,monospace}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(28px,-14px)}}
    @keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
    @keyframes wipe{0%{width:0}100%{width:520px}}
    @keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
    #b1{animation:drift 18s ease-in-out infinite}
    #b2{animation:drift 23s ease-in-out infinite reverse}
    #b3{animation:drift 26s ease-in-out infinite}
    #n{animation:rise .8s cubic-bezier(.2,.7,.25,1) .05s both}
    #s{animation:rise .8s cubic-bezier(.2,.7,.25,1) .22s both}
    #u{animation:wipe 1.1s cubic-bezier(.2,.7,.25,1) .45s both}
    .p{animation:glow 3.2s ease-in-out infinite}
  </style>
</defs>
<g clip-path="url(#round)">
  <rect width="1200" height="150" fill="url(#bg)"/>
  <rect width="1200" height="150" fill="url(#dots)"/>
  <circle id="b1" cx="180" cy="10" r="200" fill="url(#g1)"/>
  <circle id="b2" cx="1020" cy="150" r="210" fill="url(#g2)"/>
  <circle id="b3" cx="600" cy="170" r="170" fill="url(#g3)"/>

  <text id="n" class="f" x="600" y="66" text-anchor="middle" font-size="30" font-weight="800" letter-spacing="-1" fill="#F7F4FF">Subrata Pramanik</text>
  <rect id="u" x="340" y="80" height="2.5" rx="1.5" fill="url(#rule)"/>
  <text id="s" class="f" x="600" y="108" text-anchor="middle" font-size="16" font-weight="600" fill="url(#ink)">Computer Vision · Pattern Recognition · IIIT Allahabad</text>

  <g class="m" font-size="10.5" letter-spacing="2" fill="#8F88C4">
    <circle class="p" cx="470" cy="128" r="3" fill="#22C9E8"/>
    <text x="486" y="132">NOTES</text>
    <circle class="p" cx="556" cy="128" r="3" fill="#22C58B" style="animation-delay:.8s"/>
    <text x="572" y="132">PROJECTS</text>
    <circle class="p" cx="662" cy="128" r="3" fill="#F65C8E" style="animation-delay:1.6s"/>
    <text x="678" y="132">RESEARCH</text>
  </g>
</g>
</svg>
