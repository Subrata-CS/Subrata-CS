<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Subrata Pramanik — Research Scholar, Computer Vision and Pattern Recognition, IIIT Allahabad">
<title>Subrata Pramanik — Research Scholar, Computer Vision and Pattern Recognition, IIIT Allahabad</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#0A0620"/><stop offset="55%" stop-color="#151038"/><stop offset="100%" stop-color="#0A0620"/>
</linearGradient>
<linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#8B6BFF" stop-opacity="0.6"/><stop offset="100%" stop-color="#2ED8F7" stop-opacity="0.6"/>
</linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#FF6EA0" stop-opacity="0.4"/><stop offset="100%" stop-color="#B072FF" stop-opacity="0.4"/>
</linearGradient>
<clipPath id="cp"><rect width="1200" height="180" rx="22"/></clipPath>
<style>
.wv{animation:slide 16s linear infinite}.wv.b{animation-duration:23s;animation-direction:reverse}
