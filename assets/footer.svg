<g clip-path="url(#cp)">
<rect width="1200" height="180" fill="url(#bg)"/>
<g transform="translate(0,96)">
<g class="wv b"><path d="M0 56 q150 -30 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V110 H0 Z" fill="url(#w2)"/></g>
