</g>
<text x="600" y="66" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="3" fill="#FFFFFF">SUBRATA PRAMANIK</text>
<text x="600" y="98" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,ui-monospace,monospace" font-size="18" font-weight="600" letter-spacing="1.8" fill="#C3B8EE">RESEARCH SCHOLAR · COMPUTER VISION &amp; PATTERN RECOGNITION · IIIT ALLAHABAD</text>
<g class="bc">
<circle cx="566" cy="124" r="6" fill="#2FDCA0"/><circle cx="600" cy="124" r="6" fill="#2ED8F7"/><circle cx="634" cy="124" r="6" fill="#8B6BFF"/>
