<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Computer vision and pattern recognition · Research scholar at IIIT Allahabad · Ex-TCSer, building the Learning Hub">
<title>Computer Vision · Pattern Recognition — Research Scholar at IIIT Allahabad — Ex-TCSer</title>
<defs>
<linearGradient id="rain" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#8B6BFF"><animate attributeName="stop-color" values="#8B6BFF;#FF6EA0;#2ED8F7;#8B6BFF" dur="14s" repeatCount="indefinite"/></stop>
<stop offset="50%" stop-color="#B072FF"><animate attributeName="stop-color" values="#B072FF;#FFB645;#2FDCA0;#B072FF" dur="14s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#2ED8F7"><animate attributeName="stop-color" values="#2ED8F7;#8B6BFF;#FF6EA0;#2ED8F7" dur="14s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#8B6BFF"/><stop offset="25%" stop-color="#2ED8F7"/><stop offset="50%" stop-color="#2FDCA0"/>
<stop offset="75%" stop-color="#FFB645"/><stop offset="100%" stop-color="#FF6EA0"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8B6BFF" stroke-opacity="0.09" stroke-width="1"/></pattern>
<clipPath id="cp"><rect width="1200" height="200" rx="22"/></clipPath>
<style>
.ln{animation:cyc 13.5s ease-in-out infinite}
.l2{animation-delay:-9s}.l3{animation-delay:-4.5s}
@keyframes cyc{0%{opacity:0}3%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
.car{animation:blink 1.05s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.sheen{animation:sheen 9s linear infinite}
@keyframes sheen{from{transform:translateX(-420px)}to{transform:translateX(1300px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#cp)">
<rect width="1200" height="200" fill="url(#rain)"/>
<rect width="1200" height="200" fill="#0A0620" fill-opacity="0.55"/>
<rect width="1200" height="200" fill="url(#grid)"/>
<g class="sheen"><rect x="0" y="0" width="220" height="200" fill="#FFFFFF" fill-opacity="0.05"/></g>
<rect x="34" y="52" width="1132" height="96" rx="18" fill="#0A0620" fill-opacity="0.82" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
<g class="ln l1" opacity="1"><text x="600" y="118" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#2ED8F7">Computer Vision · Pattern Recognition</text><rect class="car" x="1115" y="90" width="6" height="38" rx="3" fill="#FFB645"/></g><g class="ln l2" opacity="0"><text x="600" y="118" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#B9A8FF">Research Scholar at IIIT Allahabad</text><rect class="car" x="1074" y="90" width="6" height="38" rx="3" fill="#FFB645"/></g><g class="ln l3" opacity="0"><text x="600" y="118" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="700" fill="#2FDCA0">Ex-TCSer · Building the Learning Hub</text><rect class="car" x="1102" y="90" width="6" height="38" rx="3" fill="#FFB645"/></g>
<rect x="34" y="164" width="1132" height="6" rx="3" fill="url(#bar)" fill-opacity="0.9"/>
<rect x="0.75" y="0.75" width="1198.5" height="198.5" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5"/>
</g>
