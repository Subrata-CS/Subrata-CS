<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 128" width="1200" height="128" role="img" aria-label="Featured — the Learning Hub">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0E0A2B"/><stop offset="55%" stop-color="#1A1046"/><stop offset="100%" stop-color="#100B31"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22C9E8"/><stop offset="100%" stop-color="#22C58B"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#22C9E8"/>
  </linearGradient>
  <linearGradient id="ghost" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".13"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="blob"><stop offset="0" stop-color="#22C9E8" stop-opacity=".55"/><stop offset="1" stop-color="#22C9E8" stop-opacity="0"/></radialGradient>
  <radialGradient id="blob2"><stop offset="0" stop-color="#22C58B" stop-opacity=".34"/><stop offset="1" stop-color="#22C58B" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r="1.4" fill="#fff" opacity=".09"/></pattern>
  <clipPath id="round"><rect width="1200" height="128" rx="18"/></clipPath>
  <style>
    .f{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .m{font-family:'DejaVu Sans Mono',Consolas,monospace}
    @keyframes rise{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
    @keyframes wipe{0%{width:0}100%{width:386px}}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-12px)}}
    @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
    #b1{animation:drift 16s ease-in-out infinite}
    #b2{animation:drift 21s ease-in-out infinite reverse}
    #e{animation:rise .7s cubic-bezier(.2,.7,.25,1) .05s both}
    #t{animation:rise .7s cubic-bezier(.2,.7,.25,1) .18s both}
    #u{animation:wipe .9s cubic-bezier(.2,.7,.25,1) .42s both}
    #tick{animation:glow 3s ease-in-out infinite}
  </style>
</defs>
<g clip-path="url(#round)">
  <rect width="1200" height="128" fill="url(#bg)"/>
  <rect width="1200" height="128" fill="url(#dots)"/>
  <circle id="b1" cx="90" cy="20" r="170" fill="url(#blob)"/>
  <circle id="b2" cx="1080" cy="120" r="180" fill="url(#blob2)"/>

  <text class="f" x="1176" y="106" text-anchor="end" font-size="76" font-weight="800" letter-spacing="-3"
        fill="url(#ghost)">02</text>

  <rect x="0" y="0" width="5" height="128" fill="url(#rule)"/>

  <g id="e">
    <rect id="tick" x="44" y="34" width="22" height="3" rx="1.5" fill="url(#rule)"/>
    <text class="m" x="76" y="40" font-size="11.5" letter-spacing="3" fill="#22C9E8">THE SHELF</text>
  </g>
  <text id="t" class="f" x="44" y="86" font-size="36" font-weight="700" letter-spacing="-1.1" fill="url(#ink)">Featured — the Learning Hub</text>
  <rect id="u" x="44" y="98" height="3.5" rx="2" fill="url(#rule)"/>

  <text class="m" x="1160" y="40" text-anchor="end" font-size="10.5" letter-spacing="2" fill="#8F88C4">OPEN ACCESS</text>
</g>
</svg>
