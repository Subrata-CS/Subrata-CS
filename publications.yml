name: Publications

on:
  issues:
    types: [opened, edited]
  push:
    paths:
      - "publications.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Only issues opened by the account owner with the right label can change anything.
    if: >-
      github.event_name != 'issues' ||
      ((contains(github.event.issue.labels.*.name, 'publication') ||
        contains(github.event.issue.labels.*.name, 'news') ||
        contains(github.event.issue.labels.*.name, 'award') ||
        contains(github.event.issue.labels.*.name, 'service')) &&
       github.event.issue.user.login == github.repository_owner)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the issue form
        id: add
        if: github.event_name == 'issues'
        env:
          BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ' ') }}
        run: |
          case " $LABELS " in
            *" publication "*) mode=add-paper ;;
            *" award "*)       mode=add-award ;;
            *" service "*)     mode=add-service ;;
            *)                 mode=add-news ;;
          esac
          set +e
          printf '%s' "$BODY" | python .github/scripts/profile.py "$mode" > out.txt 2> err.txt
          code=$?
          set -e
          {
            echo "ok=$([ $code -eq 0 ] && echo true || echo false)"
            echo "message<<EOM"
            cat out.txt err.txt
            echo "EOM"
          } >> "$GITHUB_OUTPUT"
          cat out.txt err.txt
          rm -f out.txt err.txt

      - name: Rebuild README
        if: github.event_name != 'issues' || steps.add.outputs.ok == 'true'
        run: python .github/scripts/profile.py build

      - name: Commit
        if: github.event_name != 'issues' || steps.add.outputs.ok == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md publications.json
          git diff --staged --quiet || git commit -m "Update publications and news"
          git push

      - name: Reply on the issue and close it
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ steps.add.outputs.ok }}
          MSG: ${{ steps.add.outputs.message }}
        run: |
          if [ "$OK" = "true" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$MSG"$'\n\nLive on the profile now; the website picks it up within a few minutes.'
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
          else
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Nothing was added:"$'\n\n'"$MSG"$'\n\nEdit this issue to fix it and it will run again.'
          fi
